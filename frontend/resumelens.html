<!DOCTYPE html>

        rgba(226, 232, 240, 0.55) 1px,

<body class="bg-white text-slate-900 antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SAMPLES = [
      {
        id: "john-doe",
        fileName: "John_Doe_Resume.pdf",
        candidateName: "John Doe",
        role: "Senior Full Stack Engineer",
        pageCount: 2,
        analyzedAt: "analyzed just now",
        overallScore: 82,
        status: "Good",
        scores: {
          ats: { current: 18, max: 20, label: "ATS & Structure" },
          skills: { current: 16, max: 20, label: "Skills" },
          experience: { current: 17, max: 20, label: "Experience" },
          jobMatch: { current: 15, max: 20, label: "Job Match" },
          education: { current: 9, max: 10, label: "Education & Projects" },
          writing: { current: 7, max: 10, label: "Writing Quality" },
        },
        keyInsights: [
          { positive: true, text: "Strong technical skills" },
          { positive: true, text: "Good project experience" },
          { positive: false, text: "Missing AWS and Docker keywords" },
          { positive: false, text: "Add measurable results to experience bullets" }
        ],
        missingKeywords: ["AWS (EC2/S3/Lambda)", "Docker Containerization", "CI/CD Pipelines", "Kubernetes", "Microservices"],
        foundKeywords: ["React.js", "Node.js", "TypeScript", "REST APIs", "PostgreSQL", "Tailwind CSS", "Git"],
        rewrites: [
          {
            original: "Worked on frontend user interface and fixed bugs on customer portal.",
            improved: "Architected responsive React/TypeScript client portal reducing page load latency by 38% and resolving 40+ high-priority bug tickets.",
            impact: "+24% recruiter engagement"
          },
          {
            original: "Responsible for backend database queries and maintaining endpoints.",
            improved: "Optimized Node.js/PostgreSQL query throughput for 120k+ daily transactions, boosting API response time by 45%.",
            impact: "+30% ATS keyword relevance"
          }
        ]
      },
      {
        id: "sarah-jenkins",
        fileName: "Sarah_Jenkins_Product_Lead.pdf",
        candidateName: "Sarah Jenkins",
        role: "Lead Product Manager",
        pageCount: 2,
        analyzedAt: "analyzed 2 mins ago",
        overallScore: 91,
        status: "Excellent",
        scores: {
          ats: { current: 20, max: 20, label: "ATS & Structure" },
          skills: { current: 18, max: 20, label: "Skills" },
          experience: { current: 19, max: 20, label: "Experience" },

          education: { current: 9, max: 10, label: "Education & Projects" },
          writing: { current: 9, max: 10, label: "Writing Quality" },

          {
            original: "Led sprint meetings and prioritized features for mobile app.",

      const radius = 54;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (sample.overallScore / 100) * circumference;

      const switchSample = () => {

                <a href="#features" className="hover:text-slate-900 transition-colors">Features</a>
                <a href="#how-it-works" className="hover:text-slate-900 transition-colors">How It Works</a>
                <a href="#pricing" className="hover:text-slate-900 transition-colors">Pricing</a>
                <a href="#faqs" className="hover:text-slate-900 transition-colors">FAQs</a>

                      {/* Donut Score + Bars */}

                            <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                              <div className="flex items-baseline justify-center">
                                <span className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                                  {sample.overallScore}
                                </span>
                                <span className="text-xs font-semibold text-slate-500 ml-0.5">/100</span>
                              </div>
                              <span className="mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/80">
                                {sample.status}

                            </div>
                          </div>
                        </div>

                        <div className="sm:col-span-7 space-y-2.5">
                          {Object.entries(sample.scores).map(([k, item]) => (
                            <div key={k} className="space-y-1">
                              <div className="flex justify-between items-center text-xs">
                                <span className="font-medium text-slate-700">{item.label}</span>

                              </div>
                              <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div
                                  className="h-full bg-blue-700 rounded-full"
                                  style={{ width: `${(item.current / item.max) * 100}%` }}
                                />
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Key Insights */}
                      <div className="pt-2 border-t border-slate-100 space-y-3">
                        <p className="text-[11px] font-bold tracking-wider text-slate-500 uppercase">
                          Key Insights
                        </p>
                        <div className="space-y-2">
                          {sample.keyInsights.map((insight, idx) => (
                            <div key={idx} className="flex items-start gap-2 text-xs">
                              {insight.positive ? (
                                <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
                              ) : (
                                <i data-lucide="alert-triangle" className="w-4 h-4 text-amber-500 shrink-0 mt-0.5"></i>
                              )}
                              <span className="text-slate-700 font-medium leading-relaxed">{insight.text}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* View Report CTA */}
                      <button
                        onClick={() => setReportOpen(true)}
                        className="w-full flex items-center justify-between px-4 py-3 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 hover:text-blue-600 transition-all shadow-sm group"

            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-wrap items-center justify-center gap-x-8 gap-y-3">
                {[

                  'Job Description Matching',

                      <h3 className="text-xl font-bold text-slate-900">Free Tier</h3>
                      <p className="text-xs text-slate-500 mt-1">Perfect for a quick resume checkup</p>
                      <div className="mt-4 flex items-baseline gap-1">
                        <span className="text-4xl font-extrabold text-slate-900">$0</span>
                        <span className="text-xs text-slate-500">/ forever</span>
                      </div>
                    </div>
                    <div className="space-y-3 pt-4 border-t border-slate-100 text-xs sm:text-sm text-slate-600">
                      <div>✓ Complete Overall Evidence Score (0-100)</div>
                      <div>✓ Basic ATS Compatibility Check</div>
                      <div>✓ Top 4 Key Insights & Red Flags</div>
                      <div>✓ PDF & DOCX Support</div>
                    </div>
                  </div>
                  <button onClick={() => setUploadOpen(true)} className="mt-8 w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs sm:text-sm rounded-xl">
                    Analyze Free
                  </button>
                </div>

                <div className="relative bg-white rounded-2xl border-2 border-blue-600 p-8 shadow-xl shadow-blue-500/10 flex flex-col justify-between">
                  <div className="absolute -top-3.5 right-6 px-3 py-1 bg-blue-600 text-white text-[11px] font-extrabold uppercase tracking-wider rounded-full">
                    Most Popular
                  </div>
                  <div className="space-y-6">
                    <div>
                      <h3 className="text-xl font-bold text-slate-900">Pro Job Seeker</h3>
                      <p className="text-xs text-slate-500 mt-1">Unlimited tailored scans and AI rewrites</p>
                      <div className="mt-4 flex items-baseline gap-1">
                        <span className="text-4xl font-extrabold text-slate-900">$19</span>
                        <span className="text-xs text-slate-500">/ month</span>
                      </div>
                    </div>
                    <div className="space-y-3 pt-4 border-t border-slate-100 text-xs sm:text-sm text-slate-700 font-medium">
                      <div>✓ Unlimited Resume & Cover Letter Scans</div>
                      <div>✓ Job Description Tailoring & Match %</div>
                      <div>✓ AI Metric-Driven Bullet Point Rewrites</div>
                      <div>✓ Detailed Keyword Gap Finder by Industry</div>
                    </div>
                  </div>
                  <button onClick={() => setUploadOpen(true)} className="mt-8 w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-md">
                    Start 7-Day Free Trial
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* 7. FAQs */}
          <section id="faqs" className="py-20 bg-slate-50/50 border-t border-slate-100">
            <div className="max-w-3xl mx-auto px-4 sm:px-6">
              <h2 className="text-3xl font-extrabold text-slate-900 text-center mb-12">
                Frequently Asked Questions
              </h2>
              <div className="space-y-4">
                {[
                  {
                    q: 'How does ResumeLens calculate the evidence-based score?',
                    a: 'Our scoring engine evaluates your resume across 6 critical dimensions: ATS parser readability, technical & hard skills presence, quantifiable impact in experience bullets, target job relevance, education structure, and grammatical clarity.'
                  },
                  {
                    q: 'Will my resume data remain secure and confidential?',
                    a: 'Yes, 100%. We do not sell your personal information or store your resume beyond your active session.'
                  },
                  {
                    q: 'What is ATS compatibility?',
                    a: 'Applicant Tracking Systems (ATS) are automated screening tools used by over 90% of Fortune 500 companies to filter resumes before recruiters review them.'
                  }
                ].map((faq, idx) => (
                  <div key={idx} className="bg-white rounded-2xl border border-slate-200/90 p-5">
                    <button
                      onClick={() => setFaqOpen(faqOpen === idx ? -1 : idx)}
                      className="w-full flex justify-between items-center text-left font-bold text-slate-900 text-sm sm:text-base"
                    >
                      <span>{faq.q}</span>
                      <i data-lucide="chevron-down" className={`w-4 h-4 transition-transform ${faqOpen === idx ? 'transform rotate-180 text-blue-600' : ''}`}></i>
                    </button>
                    {faqOpen === idx && (
                      <p className="mt-3 text-xs sm:text-sm text-slate-600 leading-relaxed border-t border-slate-50 pt-3">
                        {faq.a}
                      </p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 8. Footer */}
          <footer className="bg-slate-900 text-slate-300 py-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
              <div className="flex items-center gap-2">
                <div className="w-6 h-6 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xs">
                  RL
                </div>
                <span className="font-bold text-white">ResumeLens</span>
                <span>— Evidence-Based Resume Analysis</span>
              </div>
              <p>© {new Date().getFullYear()} ResumeLens Inc. All rights reserved.</p>
            </div>
          </footer>

          {/* Full Report Modal */}
          {reportOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 animate-fadeIn">
              <div className="relative w-full max-w-4xl bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">
                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50/80">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                      <i data-lucide="file-text" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900">{sample.fileName}</h3>
                      <p className="text-xs text-slate-500">{sample.candidateName} • {sample.role}</p>
                    </div>
                  </div>
                  <button onClick={() => setReportOpen(false)} className="p-2 text-slate-400 hover:text-slate-700 rounded-lg">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-6 flex-1 bg-slate-50/40">
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                    <div className="md:col-span-4 flex flex-col items-center justify-center">
                      <span className="text-4xl font-extrabold text-slate-900">{sample.overallScore}/100</span>
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full mt-1">{sample.status}</span>
                      <p className="text-xs text-slate-500 mt-1">Evidence Score</p>
                    </div>
                    <div className="md:col-span-8 space-y-2">
                      {Object.entries(sample.scores).map(([k, item]) => (
                        <div key={k} className="text-xs">
                          <div className="flex justify-between font-semibold text-slate-700 mb-1">
                            <span>{item.label}</span>
                            <span>{item.current}/{item.max}</span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-600" style={{ width: `${(item.current / item.max) * 100}%` }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border border-slate-200 space-y-3">
                    <h4 className="text-sm font-bold text-slate-900">Missing High-Impact Keywords</h4>
                    <div className="flex flex-wrap gap-2">
                      {sample.missingKeywords.map((kw, i) => (
                        <span key={i} className="px-3 py-1 rounded-lg bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800">
                          ⚠️ {kw}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border border-slate-200 space-y-3">
                    <h4 className="text-sm font-bold text-slate-900">AI Bullet Point Optimization</h4>
                    {sample.rewrites.map((r, i) => (
                      <div key={i} className="space-y-1.5 border-b border-slate-100 pb-3 last:border-0">
                        <p className="text-xs text-slate-400 line-through">"{r.original}"</p>
                        <p className="text-xs sm:text-sm font-semibold text-slate-900 text-blue-900">"{r.improved}"</p>
                        <span className="inline-block text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">{r.impact}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="px-6 py-4 bg-white border-t border-slate-200 flex justify-end gap-3">
                  <button onClick={() => setReportOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">
                    Close
                  </button>
                  <button onClick={() => alert("Copied recommendations to clipboard!")} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl">
                    Copy Fixes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Upload Modal */}
          {uploadOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="relative w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 border border-slate-200 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-900">Upload Resume</h3>
                  <button onClick={() => setUploadOpen(false)} className="p-1 text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div
                  onClick={() => {
                    alert("Scanning sample resume...");
                    setUploadOpen(false);
                    setReportOpen(true);
                  }}
                  className="border-2 border-dashed border-blue-300 hover:border-blue-600 rounded-xl p-8 text-center bg-blue-50/40 cursor-pointer space-y-2"
                >
                  <i data-lucide="upload-cloud" className="w-8 h-8 text-blue-600 mx-auto"></i>
                  <p className="text-xs font-bold text-slate-800">Click to Select or Drop Resume File</p>
                  <p className="text-[11px] text-slate-500">PDF, DOCX up to 10MB</p>
                </div>
              </div>
            </div>
          )}

          {/* Demo Modal */}
          {demoOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="relative w-full max-w-xl bg-white rounded-2xl shadow-2xl p-6 border border-slate-200 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-900">ResumeLens Walkthrough</h3>
                  <button onClick={() => setDemoOpen(false)} className="p-1 text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div className="aspect-video bg-slate-900 rounded-xl flex items-center justify-center text-white text-center p-4">
                  <div>
                    <i data-lucide="play" className="w-10 h-10 text-blue-400 mx-auto mb-2"></i>
                    <p className="font-bold text-sm">Interactive Demo Preview</p>
                    <p className="text-xs text-slate-400">Showing automated ATS check and keyword gap extraction</p>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
