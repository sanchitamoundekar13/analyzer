    // --- REUSABLE QUEUE WAITING TIME FORMULA ---
    function calculateWaitTime(farmersAhead, avgMinutes = 7, activeCounters = 2) {
      if (farmersAhead <= 0) return 3;
      const counters = Math.max(1, activeCounters);
      return Math.round((farmersAhead * avgMinutes) / counters);
    }

    // --- SMART RECOMMENDATION ENGINE ---
    function getSmartRecommendation(centers, userCrop = 'Wheat') {
      if (!centers || centers.length === 0) return null;
      
      const scored = centers.map(c => {
        const capacityScore = (100 - c.capacityPercent) * 0.35;
        const waitMinutes = calculateWaitTime(c.farmersAhead, c.avgProcessingMinutes, c.activeCounters);
        const waitScore = Math.max(0, (90 - waitMinutes) * (35 / 90));
        const distanceScore = Math.max(0, (25 - c.distanceKm) * (20 / 25));
        const slotScore = Math.min(10, c.availableSlots * 1.5);
        const total = Math.round(capacityScore + waitScore + distanceScore + slotScore);

        return {
          ...c,
          score: total,
          calculatedWait: waitMinutes,
          recommendedSlot: c.slots.find(s => s.available > 5)?.time || '02:00 PM - 04:00 PM'
        };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored[0];
    }

                      LIVE
                    </span>
                  </div>

                  {/* Now Serving Big Callout */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-2 bg-gradient-to-r from-emerald-950 to-slate-900 p-6 rounded-2xl border-2 border-emerald-500 text-center space-y-2">
                      <span className="text-xs font-bold uppercase tracking-widest text-emerald-300">NOW WEIGHING AT WEIGHBRIDGE 01</span>
                      <div className="text-5xl font-black font-mono text-amber-300 tracking-wider">KS-2026-1016</div>
                      <div className="text-sm text-slate-300">Baldev Yadav • Tractor-Trolley (UP 22 K 6140)</div>
                    </div>

                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-3">
                      <span className="text-xs font-bold uppercase tracking-widest text-slate-400">NEXT TOKENS IN LINE</span>
                      <div className="space-y-1.5 font-mono text-lg font-bold text-slate-200">
                        <div className="bg-slate-800/80 py-1 rounded text-amber-300">#KS-2026-1024</div>
                        <div className="bg-slate-800/80 py-1 rounded text-slate-400">#KS-2026-1025</div>
                        <div className="bg-slate-800/80 py-1 rounded text-slate-400">#KS-2026-1026</div>
                      </div>
                    </div>
                  </div>

                  {/* Yard Metrics */}
                  <div className="grid grid-cols-3 gap-4 text-center border-t border-slate-800 pt-4 text-xs font-bold">
                    <div>Average Yard Delay: <strong className="text-emerald-400 text-sm">15 Min</strong></div>
                    <div>Active Weighbridges: <strong className="text-white text-sm">2 Scales</strong></div>
                    <div>Current Mandi Crowd: <strong className="text-emerald-400 text-sm">Low Crowd</strong></div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* GLOBAL FOOTER */}
          <footer className="bg-[#07172C] text-slate-400 text-xs py-4 text-center border-t border-slate-800">
            KisanSetu • Smart India Hackathon Prototype • Intelligent Procurement Slot & Queue Management System
          </footer>

          {/* DIGITAL E-GATE PASS MODAL */}
          {isPassModalOpen && activePassToken && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div id="printable-gate-pass" className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border-2 border-[#137547] relative">
                <button
                  onClick={() => setIsPassModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 text-lg font-bold"
                >
                  ✕
                </button>

                <div className="text-center mb-3">
                  <span className="text-[10px] font-bold text-emerald-800 uppercase tracking-widest">KisanSetu Digital Token</span>
                  <h3 className="text-base font-black text-slate-900">Official E-Gate Pass</h3>
                  <div className="font-mono font-black text-sm text-[#0B2545] mt-0.5">{activePassToken.tokenNumber}</div>
                </div>

                {/* QR Code Container */}
                <div className="my-3 flex justify-center">
                  <div ref={qrContainerRef} className="p-2 bg-white border border-slate-200 rounded-xl shadow-inner min-h-[140px] flex items-center justify-center"></div>
                </div>

                <div className="border-t border-b border-dashed border-slate-200 py-2.5 text-xs space-y-1.5">
                  <div className="flex justify-between"><span className="text-slate-500">Farmer:</span><strong>{activePassToken.farmerName}</strong></div>
                  <div className="flex justify-between"><span className="text-slate-500">Kisan ID:</span><strong>{activePassToken.kisanId}</strong></div>
                  <div className="flex justify-between"><span className="text-slate-500">Crop Commodity:</span><strong className="text-emerald-800">{activePassToken.commodity}</strong></div>
                  <div className="flex justify-between"><span className="text-slate-500">Center:</span><strong>{activePassToken.centerName}</strong></div>
                  <div className="flex justify-between"><span className="text-slate-500">Arrival Slot:</span><strong className="text-amber-800">{activePassToken.slotWindow}</strong></div>
                  <div className="flex justify-between"><span className="text-slate-500">Quantity:</span><strong>{activePassToken.estimatedQuantityQtl} Quintals</strong></div>
                </div>

                <div className="mt-4 flex space-x-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 bg-[#137547] text-white font-bold text-xs rounded-xl shadow hover:bg-[#0D4F30] transition"
                  >
                    Print E-Gate Pass
                  </button>
                  <button
                    onClick={() => setIsPassModalOpen(false)}
                    className="px-4 py-2.5 bg-slate-200 text-slate-800 font-bold text-xs rounded-xl hover:bg-slate-300"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
