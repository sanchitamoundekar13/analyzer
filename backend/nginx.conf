events {
    worker_connections 4096;
}

http {
    # Rate limiting zone (20 requests/second with burst 50)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream kisansetu_cluster {
        least_conn;
        server app_node_01:8000 max_fails=3 fail_timeout=10s;
        server app_node_02:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Gzip Compression
        gzip on;
        gzip_types application/json text/plain application/javascript text/css;

        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://kisansetu_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # WebSocket Proxy for Live Mandi Yard Displays
        location /ws/ {
            proxy_pass http://kisansetu_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
